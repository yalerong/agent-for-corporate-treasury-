# 调拨规则库模板（真实 advisor_rules.yaml 已 gitignore，只在本机/内网维护）
# 三态纪律与 patterns.yaml 同构：status ∈ candidate/approved/refuted，引擎只信 approved。
# 每条规则必须带出处（source）与生效日（effective）——规则可审计是本方法论的核心卖点。
schema_version: 1
rules:
  - id: R-001
    type: independent_entity        # 独立主体：不作集团资金池，缺口只能自筹
    status: approved
    params: {entity: "HK ALPHA"}
    statement: "ALPHA 是独立主体，闲置资金不许调出"
    source: "口授示例"
    effective: "2026-08-02"

  - id: R-002
    type: fx_pool                   # 财务控制的换汇资金池（按账户名单逐户取数）
    status: approved
    params:
      side: NORTH                   # 池的名字（一个业务侧一个池）
      currency: MXN
      accounts: ["pay_NORTH_CW", "PayB-NORTH-fintek1"]
    statement: "NORTH 侧财务池=CW+fintek1 两户；主通道归业务控制不可默认动用"
    source: "口授示例"
    effective: "2026-08-02"

  - id: R-003
    type: fx_route                  # 某主体的 USD/MXN 缺口走哪侧池换汇
    status: approved
    params: {entity: "MX BETA", side: NORTH}
    statement: "BETA 的美元缺口从 NORTH 侧池换汇支付"
    source: "口授示例"
    effective: "2026-08-02"

  - id: R-004
    type: usdt_hub                  # USDT 按地址论：项目 Ledger 可归集到 hub 共用
    status: approved
    params:
      hub: "HUB_Ledger_USDT_xxxx"
      sweep_accounts: ["PROJ1_Ledger_USDT_yyyy", "PROJ2_CUSTODY_USDT"]
    statement: "USDT 到 hub 即共用；各项目 Ledger 付本项目单"
    source: "口授示例"
    effective: "2026-08-02"

  - id: R-005
    type: weekly_inflow             # 周度自然回流（保守估 low，先抵扣再谈缺口）
    status: approved
    params:
      currency: USDT
      low: 100000                   # 保守估：只作滚动覆盖，不作硬截止日的资金来源
      high: 200000
      median: 150000                # 建议用余额差分按周实测后回填，别只靠口授
      caveat: "提现是人工节奏非自然到账，存在静默周——硬截止日付款不得赌回流"
    statement: "三个项目每周提现回流 hub 约 10-15 万"
    source: "台账序列核实示例"
    effective: "2026-08-02"

  - id: R-006
    type: usdt_wealth_unlocked      # 已过锁定期、可随时赎回的理财（仅作后备）
    status: approved
    params: {amount: 100000, note: "交易所理财已解锁部分"}
    statement: "理财只作后备，回流不足才赎"
    source: "理财台账示例"
    effective: "2026-08-02"

  - id: R-007
    type: lender                    # 集团内出借方（按币种）
    status: approved
    params: {entity: "HK GAMMA", currencies: [USD]}
    statement: "USD 缺口默认由 GAMMA 拆借/往来"
    source: "口授示例"
    effective: "2026-08-02"

  # ---- v0.1 账户层规则：同一主体的账户不是同一个钱包 ----

  - id: R-008
    type: account_classification    # 分层判据（advisor_accounts.py 直接消费）
    status: approved
    params:
      channel_patterns: ["_CHANNELPAY_"]     # 过路通道户：余额常态≈0，不是弹药
      project_suffix_patterns: {_PROJA: PROJA, _PROJB: PROJB}   # 账户尾缀编码项目
      project_prefix_patterns: {"PROJA-": PROJA}                # 资金池户前缀编码项目
    statement: "项目户只能付同项目；通道户是过路的；两者都不计入可动用余额"
    source: "示例"
    effective: "2026-08-02"

  - id: R-009
    type: earmarked_account         # 专款专用户：有钱也不算可动用
    status: approved
    params:
      account: "ENTITY_SOMEBANK_USD_0001"
      purpose: "某专项代付"
      friction: "新增收付款方需合规问询，不宜临时挪用"
    statement: "专用户不计入通用可动用余额，挪用前先评估摩擦成本"
    source: "示例"
    effective: "2026-08-02"

  # ---- 主体层规则：出钱的不一定是承担成本的，缺口不一定是缺钱 ----

  - id: R-011
    type: conduit_entity            # 通道主体：不用自有钱付款，缺口=拨款未到位
    status: approved
    params:
      entities: ["HK GAMMA", "HK DELTA"]
      note_own_float: "自有周转余额量级很小，其余余额都是过路专款"
      funder_rotation: "出资方按当期实际轮换，互为通道，不可硬编码默认出借方"
    statement: >-
      识别信号：每笔出款前有等额配套拨入，余额始终回到同一个小数字。
      这类主体的"缺口"性质是**拨款未到位** → 正确动作=找当期出资方补拨，
      **不是给它做拆借合同**（找谁要钱、走哪套审批、记什么科目都不同）。
      算它可动用余额时须扣自有周转与已指定用途的专款
    source: "示例"
    effective: "2026-08-03"

  - id: R-012
    type: passthrough_payment       # 代付两型：先收后付 vs 先垫后收
    status: approved
    params:
      patterns:
        - name: 预收代付
          flow: "成本方先汇入 → 本主体转付给最终收款方"
          gap_semantics: "预收已到=无缺口；预收未到=**催成本方付款，不是内部拆借**"
        - name: 垫付记往来
          flow: "本主体先垫付 → 记对成本方应收"
          gap_semantics: "垫付方须自有头寸；缺口是真缺口，可走拆借"
    statement: >-
      **付款主体 ≠ 成本承担方**时先判是哪一型。方向搞反会凭空造一笔内部往来、
      还找错要钱的对象。识别信号：同额一进一出、摘要含"代X支付"、收付审批单号相邻。
      核对方法=查主体银行日记账的配套进账
    source: "示例"
    effective: "2026-08-03"

  - id: R-013
    type: counterparty_profile      # 对手方画像：从历史流水挖，比口授更有证据
    status: approved
    params:
      counterparty: "某高频对手方"
      timing: "账单月末集群（如 20-31 号占七成）"
      bill_types: "月账单（月末，无息） + 灵活账单（月中，带利息=垫资性质）"
      payers: ["历史上实际付过的主体清单"]
      currencies: ["不必假设只用记账本位币"]
    statement: >-
      出建议时附上"这个对手方历史上是怎么付的"。规律从 payments 库挖掘而非口授——
      有证据链、且能发现口授遗漏的路径（如某次用本地币直付离岸账单）
    source: "示例：历史流水挖掘"
    effective: "2026-08-03"

  - id: R-010
    type: account_alias             # 通道户尾号是渠道分配的虚拟账户号(VA)，会轮换
    status: approved
    params:
      normalize_rule: "按「主体_通道_币种」归一，忽略尾号；大小写一并归一"
      applies_to_patterns: ["_CHANNELPAY_"]
    statement: >-
      同一账户在不同数据源可能有不同标签（VA 轮换、大小写不一致）。
      **按前缀归一，禁止硬编码别名对**——否则下次轮换再度失配。
      质检据此区分：归一后同键=同一账户（静默处理）；键不同=真新账户（报警）
    source: "示例"
    effective: "2026-08-02"

  # ============ 2026-08 第二次实战复盘新增的规则类型（形状示例，化名）============

  - id: R-014
    type: payment_path              # 主体级付款路径：正常通道 + 受限时的代付降级链
    status: approved
    params:
      entity: "MX BETA"
      normal: "主体自己的本地银行账户直接付（多币种皆可）"
      fallback_local_ccy: "支付渠道控台代付"
      fallback_usd: "指定香港主体代付（有优先级），记关联方往来"
      note: "非急单可等渠道提现补池后再付，不必立即调拨"
    statement: >-
      主体的常规付款账户可能临时受限（银行风控/合规审查）——规则里同时登记
      正常路径和降级路径，缺口路由时先判账户可用性再选路径
    source: "示例：账户受限期的实战定式"
    effective: "2026-08-11"

  - id: R-015
    type: payment_path
    status: approved
    params:
      entity: "MX EPSILON"
      path: "资金池 → 主体自己的银行账户 → 对外支付（固定两跳，不从池直付）"
    statement: "有的主体付款定式是两跳：先从池拨到自己账户、再对外付——直付会打乱对账口径"
    source: "示例"
    effective: "2026-08-11"

  - id: R-019
    type: payment_path              # 场景级路径：习惯首选 + 可行备选（区别于 R-014 的受限降级）
    status: approved
    params:
      entity: "SG THETA"
      scenario: "某类固定场景付款（如投资人利息兑付）"
      preferred: "项目本币账户 → 同名划转 → 换汇通道 → 换汇支付外币（习惯首选，汇率优）"
      alternative: "主体外币账户直接付（可行，非首选）"
    statement: >-
      同一场景多条可行路径时，登记用户习惯为 preferred、其余为 alternative——
      引擎按首选出建议，首选资金不足或赶截止日才提备选。
      与 R-014 语义区分：normal/fallback 是"账户受限的降级"，preferred/alternative 是"都可行的偏好"
    source: "示例"
    effective: "2026-08-12"

  - id: R-016
    type: funding_route             # 缺口出资定式：谁缺钱找谁、什么形式
    status: approved
    params: {entity: "HK ZETA", funder: "HK GAMMA", form: "拆借"}
    statement: >-
      主体缺口的默认出资方与形式（拆借/划转/代付）。与 conduit_entity 并读：
      通道主体的出资方按当期轮换，此类规则只登记当前有效口径，出资方变了就更新
    source: "示例"
    effective: "2026-08-11"

  - id: R-017
    type: funding_route
    status: approved
    params:
      entities: ["HK GAMMA", "HK DELTA"]
      source: "支付渠道提现（USD 与稳定币皆有，提给哪个主体人工决定）"
      covers: "该侧账单代付，一般足够 cover"
    statement: >-
      代付主体的弹药来源=渠道提现，提现节奏人工操控——代付主体的待付
      不构成真缺口，等提现入账即可；只有硬截止日赶不上提现节奏才动后备
    source: "示例：单据核对实证"
    effective: "2026-08-11"

  - id: R-018
    type: fx_payment_capability     # 账户级换汇出账能力
    status: approved
    params:
      account: "ENTITY_SOMEBANK_USD_0001"
      capability: "出账时支付换汇：银行支持从 USD 账户直接出其他币种，出账时换汇"
    statement: >-
      个别银行账户支持付款时换汇——外币小额付款不必先调拨同币种资金，
      直接从该户出账即可。此能力按账户登记，不可推广到同银行其他账户
    source: "示例"
    effective: "2026-08-11"
